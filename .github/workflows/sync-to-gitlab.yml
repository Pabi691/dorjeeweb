name: Sync to GitLab

# Every push to main (and a manual button) mirrors the code to GitLab,
# which Hostinger then deploys. Direction: GitHub -> GitLab (the one GitLab's
# free plan can't do itself).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force-push to GitLab
        env:
          GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git push --force \
            "https://oauth2:${GL_TOKEN}@gitlab.com/Pabi691/dorjeeweb.git" \
            HEAD:main
